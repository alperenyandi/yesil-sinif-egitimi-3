<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolu Aladağlarda Yeşil Sınıf Eğitimi 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 1. Banner -->
  <header class="w-full">
    <div class="relative w-full overflow-hidden bg-[#9fc9de]">
      <img
        src="Banner2.png"
        alt="Bolu Aladağlarda Yeşil Sınıf Eğitimi 3"
        class="block w-full h-44 sm:h-56 md:h-64 lg:h-72 object-cover object-top"
      />
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-20 bg-gradient-to-b from-transparent to-slate-50"></div>
    </div>
    <h1 class="text-center text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-slate-800 mt-8 mb-4 px-4">
      Bolu Aladağlarda Yeşil Sınıf Eğitimi 3
    </h1>
  </header>

  <!-- 2. Form İkonları -->
  <!-- Pasif formlar: href başındaki # işaretini silince otomatik aktif olur -->
  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="flex flex-col md:flex-row items-center justify-center gap-12">

      <!-- İkon 1: Aktif -->
      <a
        href="https://forms.gle/2D3Jz6iMi2hawmHX7"
        target="_blank"
        rel="noopener noreferrer"
        class="form-icon group flex flex-col items-center gap-4 no-underline"
      >
        <img
          src="1ikon.png"
          alt="Öğrenci Görüş Formu"
          class="form-icon-img w-32 h-32 md:w-40 md:h-40 rounded-full object-cover shadow-lg transition-transform group-hover:scale-105"
        />
        <span class="font-bold text-center text-slate-800">Öğrenci Görüş Formu</span>
      </a>

      <!-- İkon 2: Pasif — aktif etmek için href başındaki # işaretini silin -->
      <a
        href="https://forms.gle/UMWuTCFqXZvpPf2V6"
        target="_blank"
        rel="noopener noreferrer"
        class="form-icon flex flex-col items-center gap-4 no-underline"
      >
        <img
          src="2ikon.png"
          alt="Ekolojik Ayak İzi"
          class="form-icon-img w-32 h-32 md:w-40 md:h-40 rounded-full object-cover shadow-lg transition-transform"
        />
        <span class="font-bold text-center text-slate-800">Ekolojik Ayak İzi</span>
      </a>

      <!-- İkon 3: Pasif — aktif etmek için href başındaki # işaretini silin -->
      <a
        href="https://forms.gle/MMyhWrzrFgT1V19M9"
        target="_blank"
        rel="noopener noreferrer"
        class="form-icon flex flex-col items-center gap-4 no-underline"
      >
        <img
          src="3ikon.png"
          alt="Etkinlik Değerlendirme Formu"
          class="form-icon-img w-32 h-32 md:w-40 md:h-40 rounded-full object-cover shadow-lg transition-transform"
        />
        <span class="font-bold text-center text-slate-800">Etkinlik Değerlendirme Formu</span>
      </a>

    </div>
  </main>

  <!-- 3. Proje Linki -->
  <div class="flex justify-center px-6 pb-8">
    <a
      href="https://4000.tubitak.gov.tr/4004/325b115"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-6 py-3 text-sm sm:text-base font-semibold text-slate-700 shadow-sm transition hover:bg-slate-100 hover:border-slate-400 hover:shadow-md"
    >
      Proje Sayfasını Ziyaret Edin
    </a>
  </div>

  <!-- 4. Footer Görseli -->
  <footer class="w-full mt-auto">
    <div class="relative w-full overflow-hidden bg-[#f0a020]">
      <div class="pointer-events-none absolute inset-x-0 top-0 z-10 h-14 bg-gradient-to-b from-slate-50 to-transparent"></div>
      <img
        src="Footer2.png"
        alt="Footer"
        class="block w-full h-36 sm:h-44 md:h-52 lg:h-56 object-cover object-center"
      />
    </div>
  </footer>

  <script>
    document.querySelectorAll("a.form-icon").forEach(function (link) {
      var href = link.getAttribute("href") || "";
      var img = link.querySelector(".form-icon-img");

      if (href.charAt(0) === "#") {
        link.classList.add("grayscale", "opacity-50", "pointer-events-none", "cursor-not-allowed");
        link.classList.remove("group");
        if (img) img.classList.remove("group-hover:scale-105");
      } else {
        link.classList.add("group");
        link.classList.remove("grayscale", "opacity-50", "pointer-events-none", "cursor-not-allowed");
        if (img) img.classList.add("group-hover:scale-105");
      }
    });
  </script>

</body>
</html>
